# Builds the macOS (.dmg), Windows (.exe) and Linux (.AppImage, .deb) installers, for free on GitHub.
# Runs on every "v..." tag (e.g. v0.2.0): the installers are attached to the release.
# Run by hand (Actions tab): they can be downloaded from the run summary.
# Each system builds its own: llama.cpp ships as platform-specific binaries.
name: Installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
            files: |
              release/*.dmg
              release/*.zip
              release/*.zip.sig
          - os: windows-latest
            target: win
            files: release/*.exe
          - os: ubuntu-latest
            target: linux
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    env:
      # Is there an update-signing key (secret UPDATE_KEY)? Without it there is no update archive, but the installers are still built.
      # (The secret itself is only given to the signing step, not to npm ci or the others.)
      HAS_UPDATE_KEY: ${{ secrets.UPDATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the app version is the tag's (v0.2.0 -> 0.2.0): it is what installed copies compare against
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      - run: npm run dist:${{ matrix.target }} -- --publish never
      # the signed update archive (private key in the repository secrets: UPDATE_KEY)
      - if: matrix.target == 'mac' && startsWith(github.ref, 'refs/tags/v') && env.HAS_UPDATE_KEY == 'true'
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
        run: node scripts/pack-update.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gilbert-${{ matrix.target }}
          path: ${{ matrix.files }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
