# Construit les installeurs Mac (.dmg) et Windows (.exe), gratuitement sur GitHub.
# Lancé à chaque étiquette « v… » (ex. v0.2.0) : les installeurs sont joints à la release.
# Lancé à la main (onglet Actions) : ils sont téléchargeables dans le résumé du run.
# Chaque système construit le sien : llama.cpp est livré en binaires propres à chaque plateforme.
name: Installeurs

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
            files: |
              release/*.dmg
              release/*.zip
              release/*.zip.sig
          - os: windows-latest
            target: win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      # y a-t-il une clé de signature des mises à jour (secret UPDATE_KEY) ? Sans elle, pas d'archive de mise à jour, mais les installeurs sortent quand même.
      # (Le secret lui-même n'est donné qu'à l'étape qui signe, pas à npm ci ni aux autres.)
      HAS_UPDATE_KEY: ${{ secrets.UPDATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # la version de l'appli est celle de l'étiquette (v0.2.0 → 0.2.0) : c'est elle que les Gilbert comparent
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      - run: npm run dist:${{ matrix.target }} -- --publish never
      # l'archive de mise à jour, signée (clé privée dans les secrets du dépôt : UPDATE_KEY)
      - if: matrix.target == 'mac' && startsWith(github.ref, 'refs/tags/v') && env.HAS_UPDATE_KEY == 'true'
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
        run: node scripts/pack-update.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gilbert-${{ matrix.target }}
          path: ${{ matrix.files }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
