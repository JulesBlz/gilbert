<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'">
  <title>Gilbert</title>
  <link rel="stylesheet" href="renderer.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="bubble" class="bubble" hidden>
    <div class="bubble-text"></div>
    <div class="bubble-actions" hidden></div>
    <div class="bubble-tail"></div>
  </div>
  <!-- ce que tu tapes : un cadre simple, sans pointe (la pointe, c'est quand Gilbert parle) -->
  <div id="chat" class="bubble chat" hidden>
    <div class="chat-prompt" hidden></div>
    <div class="chat-row">
      <input type="text" maxlength="300" autocomplete="off" spellcheck="false">
      <button type="button" class="chat-mic" aria-label="Parler" title="Parler (note vocale)"><svg viewBox="0 0 7 11" width="14" height="22" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 0h3v1h-3zM1 1h5v1h-5zM1 2h1v1h-1zM3 2h1v1h-1zM5 2h1v1h-1zM1 3h5v1h-5zM1 4h1v1h-1zM3 4h1v1h-1zM5 4h1v1h-1zM1 5h5v1h-5zM0 6h1v1h-1zM2 6h3v1h-3zM6 6h1v1h-1zM0 7h1v1h-1zM6 7h1v1h-1zM1 8h5v1h-5zM3 9h1v1h-1zM1 10h5v1h-5z"/></svg></button>
      <button type="button" class="chat-more" aria-label="Ouvrir Gilbert" title="Ouvrir Gilbert : guide, journal, carnet, réglages"><i></i></button>
    </div>
  </div>
  <!-- session de travail : le temps restant, au-dessus de sa tête -->
  <div id="focus-tag" class="focus-tag" hidden></div>
  <script src="renderer.js"></script>
</body>
</html>
